<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLPMS - Student Submission Portal</title>
  <script src="../config/config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 50%, #ecfdf5 100%);
      color: #0f172a;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      padding: 32px 36px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .badge {
      display: inline-block;
      background: #dcfce7;
      color: #15803d;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 13.5px;
      color: #64748b;
      margin-top: 4px;
    }

    .notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-left: 4px solid #2563eb;
      color: #1e3a8a;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .notice-icon {
      font-size: 16px;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 11px 13px;
      font-family: inherit;
      font-size: 14px;
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    input:focus, select:focus {
      outline: none;
      background: #ffffff;
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }

    input::placeholder {
      color: #94a3b8;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      margin-top: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
      transition: transform 0.12s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(22, 163, 74, 0.32);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #statusMsg {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      text-align: center;
      line-height: 1.4;
    }

    #statusMsg.success {
      display: block;
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    #statusMsg.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="badge">SLPMS Student Portal</span>
      <h1>Student Activity Submission</h1>
      <p class="subtitle">Record your completed quiz or module score below</p>
    </div>

    <div class="notice">
      <span class="notice-icon">ℹ️</span>
      <div>
        <strong>Policy Notice:</strong> Each student may submit <strong>only once</strong> per activity. Choose your Online or Offline mode carefully before submitting.
      </div>
    </div>

    <form id="submitForm" novalidate>
      <div class="form-group">
        <label for="student_name">Your Full Name</label>
        <input type="text" id="student_name" placeholder="e.g. Juan Dela Cruz" required>
      </div>

      <div class="form-group">
        <label for="activity_id">Select Quiz / Activity</label>
        <select id="activity_id" required>
          <option value="">Loading available activities...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="mode">Submission Mode</label>
        <select id="mode" required>
          <option value="Online">Online (Digital Submission)</option>
          <option value="Offline">Offline (Printed Module / In-Person)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="raw_score">Quiz Score Obtained</label>
        <input type="number" id="raw_score" placeholder="Enter your score" min="0" step="any" required>
      </div>

      <button type="submit" id="submitBtn">Submit Final Answer</button>
    </form>

    <div id="statusMsg" role="alert"></div>
    <p class="footer-note">Student Learning Performance Monitoring System</p>
  </div>

  <script>
    let lastActivityHash = '';
    let activitiesList = [];

    function updateMaxScoreLimit() {
      const selectedId = Number(document.getElementById('activity_id').value);
      const activity = activitiesList.find(a => a.id === selectedId);
      const scoreInput = document.getElementById('raw_score');

      if (activity && activity.max_score !== undefined) {
        scoreInput.max = activity.max_score;
        scoreInput.placeholder = `Enter your score (0 - ${activity.max_score})`;
      }
    }

    async function loadActivities() {
      try {
        const res = await fetch(`${CONFIG.API_BASE_URL}/activities`);
        const activities = await res.json();
        const currentHash = JSON.stringify(activities);

        if (currentHash === lastActivityHash) return;
        lastActivityHash = currentHash;
        activitiesList = activities;

        const select = document.getElementById('activity_id');
        const previousSelection = select.value;

        if (!activities.length) {
          select.innerHTML = '<option value="">No active quizzes available yet</option>';
          return;
        }

        select.innerHTML = activities.map(a => {
          const due = new Date(a.deadline).toLocaleString();
          return `<option value="${a.id}">${a.title} (Max: ${a.max_score} pts | Due: ${due})</option>`;
        }).join('');

        if (previousSelection) select.value = previousSelection;
        updateMaxScoreLimit();
      } catch (err) {
        console.error('Failed to sync activities:', err);
      }
    }

    document.getElementById('activity_id').addEventListener('change', updateMaxScoreLimit);

    document.getElementById('submitForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msgEl = document.getElementById('statusMsg');

      const studentName = document.getElementById('student_name').value.trim();
      const activityId = Number(document.getElementById('activity_id').value);
      const rawScoreStr = document.getElementById('raw_score').value.trim();
      const rawScore = Number(rawScoreStr);
      const selectedActivity = activitiesList.find(a => a.id === activityId);

      // Basic empty-field check
      if (!studentName || !activityId || rawScoreStr === '' || Number.isNaN(rawScore)) {
        msgEl.innerText = 'Error: Please complete all fields before submitting.';
        msgEl.className = 'error';
        return;
      }

      // Negative score check
      if (rawScore < 0) {
        msgEl.innerText = 'Error: Score cannot be negative.';
        msgEl.className = 'error';
        return;
      }

      // Max score check
      if (selectedActivity && rawScore > Number(selectedActivity.max_score)) {
        msgEl.innerText = `Error: Score (${rawScore}) cannot exceed the maximum score of ${selectedActivity.max_score} pts for "${selectedActivity.title}".`;
        msgEl.className = 'error';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Submitting...';
      msgEl.className = '';
      msgEl.innerText = '';

      const payload = {
        student_name: studentName,
        activity_id: activityId,
        mode: document.getElementById('mode').value,
        raw_score: rawScore
      };

      try {
        const res = await fetch(`${CONFIG.API_BASE_URL}/submissions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
          msgEl.innerText = data.error;
          msgEl.className = 'error';
        } else {
          msgEl.innerText = data.message;
          msgEl.className = 'success';
          document.getElementById('raw_score').value = '';
        }
      } catch (err) {
        msgEl.innerText = 'Network error: Unable to reach the server. Please try again.';
        msgEl.className = 'error';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Submit Final Answer';
      }
    });

    loadActivities();
    setInterval(loadActivities, 3000);
  </script>
</body>
</html>
